name: Balance exam readiness
on:
  push:
    branches: [codex/balance-readiness-20261012]
    paths: ['.github/workflows/balance-exam-readiness.yml']
permissions:
  contents: write
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inherited exam
        shell: bash
        run: |
          git restore --source=11738bf7e5ffdb0234da370adb5e3c6c0fcb0ee5 --worktree source/src source/test
          mkdir -p exam-readiness
          cd source
          set +e
          timeout 300 node tools/bfai_exam.js --lint > ../exam-readiness/lint.log 2>&1
          code=$?
          echo "$code" > ../exam-readiness/exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: balance-exam-readiness
          path: exam-readiness/
      - name: Save diagnostic results
        run: |
          mkdir -p docs/codex/balance-readiness-20261012/exam
          cp exam-readiness/* docs/codex/balance-readiness-20261012/exam/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/codex/balance-readiness-20261012/exam
          git commit -m "Record exam readiness diagnostic results"
          git push origin HEAD:codex/balance-readiness-20261012
      - name: Enforce lint outcome
        run: test "$(cat exam-readiness/exit-code.txt)" = "0"
