name: Balance exam readiness
on:
  push:
    branches: [codex/balance-readiness-20261012]
    paths: ['.github/workflows/balance-exam-readiness.yml']
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: balance-exam-readiness
          run-id: 38252182759
          github-token: ${{ github.token }}
          path: exam-readiness
      - name: Save existing diagnostics
        run: |
          mkdir -p docs/codex/balance-readiness-20261012/exam
          cp exam-readiness/* docs/codex/balance-readiness-20261012/exam/
          cat exam-readiness/lint.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/codex/balance-readiness-20261012/exam
          git commit -m "Recover saved exam diagnostic evidence"
          git pull --rebase origin codex/balance-readiness-20261012
          git push origin HEAD:codex/balance-readiness-20261012
      - name: Report original lint outcome
        run: |
          echo "Original lint exit code: $(cat exam-readiness/exit-code.txt)"
          test "$(cat exam-readiness/exit-code.txt)" = "0"
