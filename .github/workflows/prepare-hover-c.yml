name: Validate and prepare approved hover C
on:
  push:
    branches: [codex/hover-c-final-20261013]
    paths: [.github/workflows/prepare-hover-c.yml, .release/smoke.cjs]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact approved module
        run: |
          curl -fL --retry 3 https://raw.githubusercontent.com/liukaidipeng-ops/chuhan_gpt_play/7b86c7ac0956f08e0d623062274a91f1c5ac49c8/.release/piece-hover-c.js -o .release/piece-hover-c.js
          echo 'c8cd7651fb318608465ce00238b0aaaa28fb3cb8bad9585e21255a6ec651823c  .release/piece-hover-c.js' | sha256sum -c -
      - name: Build only the approved delta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,subprocess,tempfile
          p=Path('index.html');before=p.read_bytes()
          h=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert h(before)=='16f6dc9dd3560efd355cca46d03477bfda1cb804', 'Baseline changed; stop rather than overwrite'
          js=Path('.release/piece-hover-c.js').read_text();text=before.decode()
          assert text.count('</body>')==1 and '// ---- piece-hover-c.js ----' not in text
          version='2026.10.13-hoverc-'+hashlib.sha1(js.encode()).hexdigest()[:6]
          text,n=re.subn(r'(window\.APP_VERSION\s*=\s*[\x27\x22])([^\x27\x22]+)',lambda m:m[1]+version,text,count=1);assert n==1
          text=text.replace('</body>','<script>// ---- piece-hover-c.js ----\n'+js+'</script>\n</body>')
          with tempfile.TemporaryDirectory() as d:
            for i,code in enumerate(re.findall(r'<script\b[^>]*>(.*?)</script>',text,re.S)):
              f=Path(d)/f'{i}.js';f.write_text(code);subprocess.run(['node','--check',str(f)],check=True,capture_output=True)
          p.write_text(text);Path('version.json').write_text(json.dumps({'v':version},separators=(',',':')))
          b=Path('source/build.js');s=b.read_text();assert "'environment', 'main'];" in s
          b.write_text(s.replace("'environment', 'main'];", "'environment', 'main', 'piece-hover-c'];",1))
          Path('source/src/piece-hover-c.js').write_text(js)
          subprocess.run(['node','--check',str(b)],check=True)
          print('VERSION',version)
          PY
      - name: Install browser test tooling
        run: |
          npm install --prefix .release --no-package-lock --ignore-scripts playwright@1.57.0
          .release/node_modules/.bin/playwright install --with-deps chromium
      - name: Test real game hover interactions in Chromium
        run: |
          python3 -m http.server 8765 >/tmp/hover-http.log 2>&1 &
          node .release/smoke.cjs
      - name: Save validated files on preparation branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json source/build.js source/src/piece-hover-c.js
          git commit -m 'build: browser-tested hover C, preview opacity reduced by 30 percent'
          git push origin HEAD:codex/hover-c-final-20261013
          git ls-tree HEAD index.html version.json source/build.js source/src/piece-hover-c.js
