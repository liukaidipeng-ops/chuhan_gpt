name: Balance A6 Q1-Q4

on:
  workflow_dispatch:
  push:
    branches:
      - codex/balance-a6-n12-20261012
    paths:
      - source/tools/a6_exam.js
      - .github/workflows/balance-a6.yml

permissions:
  contents: read

jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BFAI_NEXT_BASE: 54ba8bc
      BFAI_TUNE_W: tools/tune/w_t6.json
      BFAI_TUNE_FAST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore current rules and tests
        run: git checkout 11738bf -- source/src source/test
      - name: Run A6 Q1-Q4 at hard 100k nodes
        run: node source/tools/a6_exam.js
      - name: Verify tracked evidence matches this run
        if: success()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const normalize = value => {
            if (Array.isArray(value)) return value.map(normalize);
            if (value && typeof value === 'object') {
              const out = {};
              for (const [key, item] of Object.entries(value)) {
                if (key === 'generatedAt' || key === 'repo' || key === 'ms') continue;
                out[key] = normalize(item);
              }
              return out;
            }
            return value;
          };
          const actual = JSON.parse(fs.readFileSync('a6-results/a6-q1-q4.json', 'utf8'));
          const expected = JSON.parse(fs.readFileSync('docs/codex/a6/a6-q1-q4.json', 'utf8'));
          assert.deepStrictEqual(normalize(actual), normalize(expected));
          NODE
          grep -q '## Q1: 3/3' a6-results/A6-Q1-Q4-成绩.md
          grep -q '## Q2: 3/3' a6-results/A6-Q1-Q4-成绩.md
          grep -q '## Q3: 3/3' a6-results/A6-Q1-Q4-成绩.md
          grep -q '## Q4: 3/3' a6-results/A6-Q1-Q4-成绩.md
          git diff --exit-code -- source/src source/test
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-a6-q1-q4
          path: a6-results/
          if-no-files-found: warn
