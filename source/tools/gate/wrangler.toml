# 试玩码入口。部署：先 node ../../build.js 出 dist/site，再 npx wrangler deploy（见 README.md）
name = "xiangqi-trial"
main = "worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "../../dist/site"
binding = "ASSETS"
run_worker_first = true   # 关键：连 index.html、语音包也先过 Worker，没有会话拿不到

[[kv_namespaces]]
binding = "CODES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
