// 造型对比：象腿三版、金盾三版。window.show(kind, v, t) 摆出某一版在某一刻的样子，截图用
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); R.setPixelRatio(1);
R.outputColorSpace = THREE.SRGBColorSpace; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;

const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(9);

  g.globalAlpha = .1; for (let i = 0; i < 80; i++) { g.strokeStyle = i % 2 ? '#8a5a2a' : '#fff3d8'; g.lineWidth = 1 + rnd() * 3; g.beginPath(); const y = rnd() * h; g.moveTo(0, y); g.bezierCurveTo(w * .3, y + 20, w * .7, y - 20, w, y + 8); g.stroke(); }

const faceTex = (ch, red) => cv(256, 256, (g, w) => { const c = w / 2; g.fillStyle = '#ecd2a0'; g.beginPath(); g.arc(c, c, c - 2, 0, 7); g.fill(); g.strokeStyle = red ? '#a8281c' : '#141311'; g.lineWidth = 10; g.beginPath(); g.arc(c, c, c - 14, 0, 7); g.stroke(); g.fillStyle = red ? '#a8281c' : '#141311'; g.font = '900 128px "Noto Serif SC","Songti SC",serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ch, c, c + 6); });
const side = new THREE.MeshStandardMaterial({ color: 0xc9945a, roughness: .5 });
function piece(ch, red, x, z) { const m = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .22, 48), [side, new THREE.MeshStandardMaterial({ map: faceTex(ch, red), roughness: .5 }), side]); m.position.set(x, .11, z); m.castShadow = true; scene.add(m); return m; }
piece('兵', true, 0, 0); piece('兵', true, -1, 0); piece('相', true, 1, 1); piece('象', false, 0, -1.6); piece('帥', true, 2.6, 2.4); piece('仕', true, 3.6, 2.4); piece('車', false, 2.6, -1.4);

// —— 共用：带边缘光、上淡下实的半透明材质（虚影都用它）——
function ghost({ map = null, color = 0x2b2622, rim = 0xfff0c8, rimK = 1.2, op = .85, fadeY0 = 1.5, fadeY1 = 4, add = false, emis = 0 }) {
  return new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.FrontSide, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending,
    uniforms: { map: { value: map }, useMap: { value: map ? 1 : 0 }, color: { value: new THREE.Color(color) }, rim: { value: new THREE.Color(rim) }, rimK: { value: rimK }, op: { value: op }, f0: { value: fadeY0 }, f1: { value: fadeY1 }, k: { value: 1 }, emis: { value: emis } },

}
// —— 象腿（第二版）：真象腿的特征——脚掌圆而外撑、前面一排象牙色大趾甲；脚踝、膝盖两处一圈圈深褶；
//     往上大腿变粗接进身子；整条腿略往前倾（正在踩下去）——
const sm = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function legGeo() {

    const ph = Math.sin(a * 2 + y * .7) * 1.2 + Math.sin(a * 5) * .35;   // 褶子不是正圆环：前后高低不一、断续
    const crease = Math.pow(Math.abs(Math.sin(y * 30 + ph)), 7);   // 尖的凹线

}

// 象皮：灰底、裂纹网（龟裂）、横褶阴影
const skinTex = (base, line, line2) => cv(1024, 1024, (g, w, h) => { g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++) { g.globalAlpha = .05 + rnd() * .08; g.fillStyle = rnd() < .5 ? line2 : '#ffffff'; g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 6, 2 + rnd() * 6); }

  for (let y = 0; y < h; y += 7 + rnd() * 12) { g.globalAlpha = .18 + rnd() * .3; g.lineWidth = 1.5 + rnd() * 2.5; g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= w; x += 24) g.lineTo(x, y + Math.sin(x / 60 + y) * 5 + (rnd() - .5) * 3); g.stroke(); }   // 横皱
  g.globalAlpha = 1; });
const inkSkin = skinTex('#8c857c', '#2a2420', '#4a433c');

// 金线：透明底，只有描金的褶线和龟裂（像金线勾出来的象腿）
const goldLine = cv(1024, 1024, (g, w, h) => { g.clearRect(0, 0, w, h); g.strokeStyle = '#ffe6a6'; g.lineCap = 'round';
  for (let y = 0; y < h; y += 10 + rnd() * 16) { g.globalAlpha = .5 + rnd() * .5; g.lineWidth = 1.2 + rnd() * 2; g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= w; x += 20) g.lineTo(x, y + Math.sin(x / 70 + y) * 6); g.stroke(); }
  for (let i = 0; i < 300; i++) { let x = rnd() * w, y = rnd() * h; g.globalAlpha = .25 + rnd() * .3; g.lineWidth = 1; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 3; k++) { x += (rnd() - .5) * 40; y += (rnd() - .5) * 18; g.lineTo(x, y); } g.stroke(); } });

  if (L) { vg.addColorStop(0, 'rgba(244,236,218,0)'); vg.addColorStop(.4, 'rgba(244,236,218,.28)'); vg.addColorStop(1, 'rgba(244,236,218,.55)'); }
  else { vg.addColorStop(0, 'rgba(46,42,38,0)'); vg.addColorStop(.35, 'rgba(46,42,38,.35)'); vg.addColorStop(.8, 'rgba(36,32,29,.78)'); vg.addColorStop(1, 'rgba(24,21,19,.92)'); }

  for (let i = 0; i < 320; i++) { const t = .25 + rnd() * .72, hw = r(t) * U * .85, x = cx + (rnd() - .5) * 2 * hw, y = Y(t); g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - .5) * 24, y + (rnd() - .5) * 10); g.strokeStyle = `rgba(8,7,6,${.12 + rnd() * .2})`; g.lineWidth = 1 + rnd() * 1.4; g.stroke(); }   // 龟裂短笔

};
